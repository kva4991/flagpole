<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210"><defs>
 <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#176b87"/></marker>
 <marker id="dimarr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M0,0 L6,3 L0,6 z" fill="#176b87"/></marker>
 <style>.title{font:700 7px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.sub{font:3.4px 'DejaVu Sans',Arial,sans-serif;fill:#52616a}.h{font:700 4.4px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.t{font:3.1px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.small{font:2.8px 'DejaVu Sans',Arial,sans-serif;fill:#52616a}.dim{font:700 3px 'DejaVu Sans',Arial,sans-serif;fill:#176b87}.petg{fill:#ee8a3d;stroke:#98521f;stroke-width:.7}.tpu95{fill:#929ca3;stroke:#4f5a61;stroke-width:.6}.tpu85{fill:#c2c9ce;stroke:#667178;stroke-width:.6}.metal{fill:#606c73;stroke:#222b30;stroke-width:.6}.nut{fill:#a5aaae;stroke:#252b2f;stroke-width:.65}.board{fill:#369662;stroke:#1c5f3d;stroke-width:.6}.esp{fill:#b44242;stroke:#6d2222;stroke-width:.6}.mos{fill:#4f65a9;stroke:#2c3868;stroke-width:.6}.buck{fill:#369662;stroke:#1c5f3d;stroke-width:.6}.window{fill:#92cceb;stroke:#316b8a;stroke-width:.5}.membrane{fill:#d9e6eb;stroke:#647a84;stroke-width:.5}.active{fill:#9ac8da;stroke:#416e80;stroke-width:.4}.air{fill:none;stroke:#176b87;stroke-width:.7;stroke-dasharray:2 1}.arrow{fill:none;stroke:#176b87;stroke-width:.8;marker-end:url(#arr)}.dimension{fill:none;stroke:#176b87;stroke-width:.7;marker-start:url(#dimarr);marker-end:url(#dimarr)}.note{fill:#fff;stroke:#c7d1d5;stroke-width:.45}.cut{fill:#fff6ef;stroke:#bd6b31;stroke-width:.55}.wire{fill:none;stroke:#23282c;stroke-width:1.4}.wire2{fill:none;stroke:#4d555a;stroke-width:1.4}.glue{fill:#f0b13e;stroke:#9a6812;stroke-width:.45}</style>
</defs><rect width="297" height="210" fill="#f5f6f7"/>
<text x="148.5" y="10" text-anchor="middle" class="title">Карта закладных гаек и крепежа v0.7.4</text><text x="148.5" y="16" text-anchor="middle" class="sub">все текущие винтовые соединения имеют обслуживаемую закладную; точный натяг проверяется отдельными купонами M4 и M3</text>
<rect x="12" y="28" width="164" height="103" rx="4" class="note"/><text x="20" y="38" class="h">A. Ротор и зажим спицы — 8×M4</text><circle cx="69" cy="74" r="33" class="petg" fill-opacity=".6"/><rect x="91" y="53" width="67" height="43" rx="7" class="petg" fill-opacity=".6"/><rect x="28" y="48" width="29" height="50" rx="5" class="petg" fill-opacity=".6"/><polygon points="59.42,55.45 59.42,60.55 55.00,63.10 50.58,60.55 50.58,55.45 55.00,52.90" class="nut"/><text x="55" y="59" text-anchor="middle" class="small">M4</text><polygon points="82.42,55.45 82.42,60.55 78.00,63.10 73.58,60.55 73.58,55.45 78.00,52.90" class="nut"/><text x="78" y="59" text-anchor="middle" class="small">M4</text><polygon points="59.42,87.45 59.42,92.55 55.00,95.10 50.58,92.55 50.58,87.45 55.00,84.90" class="nut"/><text x="55" y="91" text-anchor="middle" class="small">M4</text><polygon points="82.42,87.45 82.42,92.55 78.00,95.10 73.58,92.55 73.58,87.45 78.00,84.90" class="nut"/><text x="78" y="91" text-anchor="middle" class="small">M4</text><polygon points="119.42,64.45 119.42,69.55 115.00,72.10 110.58,69.55 110.58,64.45 115.00,61.90" class="nut"/><text x="115" y="68" text-anchor="middle" class="small">M4</text><polygon points="119.42,84.45 119.42,89.55 115.00,92.10 110.58,89.55 110.58,84.45 115.00,81.90" class="nut"/><text x="115" y="88" text-anchor="middle" class="small">M4</text><polygon points="149.42,64.45 149.42,69.55 145.00,72.10 140.58,69.55 140.58,64.45 145.00,61.90" class="nut"/><text x="145" y="68" text-anchor="middle" class="small">M4</text><polygon points="149.42,84.45 149.42,89.55 145.00,92.10 140.58,89.55 140.58,84.45 145.00,81.90" class="nut"/><text x="145" y="88" text-anchor="middle" class="small">M4</text>
<path d="M115 100 C104 112 93 117 75 119" class="arrow"/><text x="20" y="122" class="t">6 гаек стягивают корпус; 2 гайки зажимают втулку спицы.</text><text x="20" y="128" class="small">Загрузочные горловины и доступ к гайкам не перекрываются дорожкой проводов.</text>
<rect x="183" y="28" width="102" height="73" rx="4" class="note"/><text x="191" y="38" class="h">B. Крышка — 4×M3</text><rect x="198" y="47" width="64" height="43" rx="5" class="petg" fill-opacity=".55"/><polygon points="208.64,50.90 208.64,55.10 205.00,57.20 201.36,55.10 201.36,50.90 205.00,48.80" class="nut"/><text x="205" y="54" text-anchor="middle" class="small">M3</text><polygon points="258.64,50.90 258.64,55.10 255.00,57.20 251.36,55.10 251.36,50.90 255.00,48.80" class="nut"/><text x="255" y="54" text-anchor="middle" class="small">M3</text><polygon points="208.64,81.90 208.64,86.10 205.00,88.20 201.36,86.10 201.36,81.90 205.00,79.80" class="nut"/><text x="205" y="85" text-anchor="middle" class="small">M3</text><polygon points="258.64,81.90 258.64,86.10 255.00,88.20 251.36,86.10 251.36,81.90 255.00,79.80" class="nut"/><text x="255" y="85" text-anchor="middle" class="small">M3</text><text x="191" y="96" class="small">гайки находятся вне сухого контура прокладки</text>
<rect x="183" y="106" width="102" height="38" rx="4" class="note"/><text x="191" y="116" class="h">C. Карман датчика — 2×M3</text><polygon points="208.64,120.90 208.64,125.10 205.00,127.20 201.36,125.10 201.36,120.90 205.00,118.80" class="nut"/><text x="205" y="124" text-anchor="middle" class="small">M3</text><polygon points="258.64,120.90 258.64,125.10 255.00,127.20 251.36,125.10 251.36,120.90 255.00,118.80" class="nut"/><text x="255" y="124" text-anchor="middle" class="small">M3</text><text x="191" y="139" class="small">крепёжные уши вне воздушной камеры</text>
<rect x="12" y="137" width="164" height="42" rx="4" class="note"/><text x="20" y="147" class="h">D. Неподвижный воротник — 2×M3</text><rect x="45" y="154" width="70" height="18" rx="9" class="petg" fill-opacity=".55"/><polygon points="68.64,161.90 68.64,166.10 65.00,168.20 61.36,166.10 61.36,161.90 65.00,159.80" class="nut"/><text x="65" y="165" text-anchor="middle" class="small">M3</text><polygon points="98.64,161.90 98.64,166.10 95.00,168.20 91.36,166.10 91.36,161.90 95.00,159.80" class="nut"/><text x="95" y="165" text-anchor="middle" class="small">M3</text><text x="122" y="161" class="t">гайки в ответной половине;</text><text x="122" y="167" class="t">не использовать саморезы в PETG</text>
<rect x="183" y="149" width="102" height="30" rx="4" class="note"/><text x="191" y="158" class="h">E. Опора VEML7700 — 2×M3</text><polygon points="213.64,167.90 213.64,172.10 210.00,174.20 206.36,172.10 206.36,167.90 210.00,165.80" class="nut"/><text x="210" y="171" text-anchor="middle" class="small">M3</text><polygon points="258.64,167.90 258.64,172.10 255.00,174.20 251.36,172.10 251.36,167.90 255.00,165.80" class="nut"/><text x="255" y="171" text-anchor="middle" class="small">M3</text>
<rect x="12" y="184" width="273" height="15" rx="3" class="note"/><text x="17" y="191" class="t">Итого: 8×M4 + 10×M3. Гайки устанавливаются после примерки купона; карман удерживает гайку, но позволяет заменить её при обслуживании.</text><text x="17" y="197" class="small">Флаг, шаблон рыбы и электрическая схема не используют собственные гайки; их механические ссылки ведут на эту карту.</text></svg>