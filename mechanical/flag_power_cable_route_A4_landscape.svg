<text x="193.3" y="115.82142857142858" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.0" font-weight="700" fill="#172126">#tpu95-3 / #tpu95-4</text>
<text x="219" y="155" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#176b87">маршрут проходит снаружи;</text>
<text x="219" y="159" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#176b87">подшипники и спица не пересекаются</text>
<rect x="12" y="164" width="273" height="34" rx="3" fill="#fff" stroke="#c3cdd2" stroke-width="0.5"/>
<text x="17" y="170.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#172126">1. Герметичный 2-контактный разъём расположен у флага ниже спицы.</text>
<text x="17" y="175.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#172126">2. Кабель Ø≈4.4 мм укладывается в открытую наружную канавку радиусом 3 мм.</text>
<text x="17" y="180.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#172126">3. Канавка огибает корпус снаружи и не ослабляет подшипниковые посадки.</text>
<text x="17" y="185.6" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#172126">4. Вход в бокс расположен у его флаговой стенки и уплотнён разрезной TPU95-разгрузкой.</text>
<text x="17" y="190.8" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.4" fill="#172126">5. Внутри оставить короткую сервисную петлю до клеммы/MOSFET. Размеры уточнить по фактическим кабелю и разъёму.</text>
</svg>