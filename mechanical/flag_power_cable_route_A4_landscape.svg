<text x="111" y="161.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#172126">1. Два провода Ø2 мм не проходят через спицу и не пересекают посадки подшипников.</text>
<text x="111" y="167.1" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#172126">2. PETG-дорожка проходит через наружную низкую точку и поднимается к отмеченной точке.</text>
<text x="111" y="173.2" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#172126">3. #tpu95-10 направляет провода примерно под 35° вниз к флагу и защищает изоляцию.</text>
<text x="111" y="179.3" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#172126">4. Закладная M4 и головка крепежа остаются выше трассы; доступ к гайке сохраняется.</text>
<text x="111" y="185.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="3.05" fill="#172126">5. Перед печатью проверить купон 4,2 × 2,5 мм, реальный радиус изгиба и дождевой тест.</text>
