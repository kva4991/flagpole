<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390mm" height="250mm" viewBox="-90 0 390 250">
  <rect x="-90" y="0" width="390" height="250" fill="white"/>
  <rect x="0" y="0" width="300" height="250" fill="#fff3e8" stroke="#c85700" stroke-width="1.2"/>
  <rect x="-72" y="0" width="18" height="250" rx="6" fill="#202020"/>

  <!-- Four orange fabric loops: top edge 10 mm below the lower edge of the assembled finial; bottom edge flush with flag bottom. -->
  <g fill="none" stroke="#f36a00" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 11 45.000 L -48 45.000 C -82 45.000 -82 65.000 -48 65.000 L 11 65.000"/>
    <path d="M 11 106.667 L -48 106.667 C -82 106.667 -82 126.667 -48 126.667 L 11 126.667"/>
    <path d="M 11 168.333 L -48 168.333 C -82 168.333 -82 188.333 -48 188.333 L 11 188.333"/>
    <path d="M 11 230.000 L -48 230.000 C -82 230.000 -82 250.000 -48 250.000 L 11 250.000"/>
  </g>
  <g fill="none" stroke="#9a4b18" stroke-width="0.8" stroke-dasharray="3 2">
    <rect x="0" y="40.000" width="16" height="30"/>
    <rect x="0" y="101.667" width="16" height="30"/>
    <rect x="0" y="163.333" width="16" height="30"/>
    <rect x="0" y="220.000" width="16" height="30"/>
  </g>
  <!-- Datum: the assembled finial lower edge is 35 mm below the flag top; the first seam begins 10 mm lower. -->
  <line x1="-88" y1="35" x2="24" y2="35" stroke="#c9362b" stroke-width="0.9" stroke-dasharray="3 2"/>
  <text x="18" y="32" font-family="DejaVu Sans,Arial,sans-serif" font-size="5" fill="#c9362b">нижняя кромка навершия</text>
  <line x1="-85" y1="35" x2="-85" y2="45" stroke="#176b87" stroke-width="0.8"/>
  <text x="-82" y="42" font-family="DejaVu Sans,Arial,sans-serif" font-size="5" fill="#176b87">10 мм</text>


  <!-- Standard fish LED/neon path, tail left. -->
  <g fill="none" stroke="#111" stroke-width="16" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <path d="M 88 125 C 137 70 230 70 284 125 C 230 180 137 180 88 125"/>
    <path d="M 88 125 L 38 72"/>
    <path d="M 88 125 L 38 178"/>
  </g>

  <!-- Reflective fabric pieces: body and tail are separate. -->
  <path d="M 101 125 C 143 86 221 86 268 125 C 221 164 143 164 101 125 Z"
        fill="#cbd0d4" stroke="#60666a" stroke-width="1.2"/>
  <path d="M 49 87 L 77 125 L 49 163 Z" fill="#cbd0d4" stroke="#60666a" stroke-width="1.2"/>

  <!-- Eye is a through cut, not an LED. -->
  <circle cx="243" cy="125" r="8" fill="#fff3e8" stroke="#111" stroke-width="1.2"/>
  <text x="296" y="244" text-anchor="end" font-family="DejaVu Sans,Arial,sans-serif" font-size="4.2" fill="#52616a">v0.7.4 · закладные гайки относятся к навершию, см. карту крепежа 124</text>
</svg>
