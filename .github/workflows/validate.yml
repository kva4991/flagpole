name: Validate Crucian

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run repository quality gate
        run: npm run quality:gate

      - name: Check v0.6 mechanical Python sources
        run: python -m py_compile mechanical/generate_models_v06.py mechanical/render_previews_v06.py mechanical/generate_reference_diagrams_v06.py mechanical/render_flag_power_route_v06.py mechanical/render_part_id_drawings_v06.py mechanical/validate_models_v06.py

  mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mechanical/requirements.txt

      - name: Install mechanical dependencies
        run: python -m pip install --requirement mechanical/requirements.txt

      - name: Regenerate v0.6 mechanics and diagrams
        run: |
          python mechanical/generate_models_v06.py
          python mechanical/render_previews_v06.py
          python mechanical/render_part_id_drawings_v06.py
          python mechanical/render_flag_power_route_v06.py
          python mechanical/generate_reference_diagrams_v06.py

      - name: Validate all generated STL files
        run: python mechanical/validate_models_v06.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android/crucian-control
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: crucian-control-debug
          path: android/crucian-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: electronics/firmware/esp32_c3_crucian_v06
            environment: esp32-c3-devkitm-1
            artifact: crucian-v06-firmware
          - project: electronics/firmware/esp32_c3_flag_light
            environment: esp32-c3-supermini-plus
            artifact: flag-light-legacy-firmware
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        run: pio run --project-dir "${{ matrix.project }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/.pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
