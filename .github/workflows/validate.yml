name: Validate Crucian

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'agent/**'
      - 'review/**'

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    outputs:
      mechanical: ${{ steps.changes.outputs.mechanical }}
      android: ${{ steps.changes.outputs.android }}
      firmware: ${{ steps.changes.outputs.firmware }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          lfs: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Classify changed project areas
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$RUNNER_TEMP/flagpole-changed-files.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' '__all__' > "$changed"
          else
            base="$BEFORE_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then base="$BASE_SHA"; fi
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              printf '%s\n' '__all__' > "$changed"
            else
              git fetch --no-tags --depth=1 origin "$base"
              git diff --name-only "$base" "$GITHUB_SHA" > "$changed"
            fi
          fi
          node scripts/classifyCiChanges.mjs "$changed" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mechanical/requirements.txt

      - name: Install catalogue drawing dependencies
        run: python -m pip install --requirement mechanical/requirements.txt

      - name: Run repository quality gate
        run: npm run quality:core

      - name: Compile-check project Python sources
        run: >-
          python -m py_compile
          mechanical/generate_models_v06.py
          mechanical/render_previews_v06.py
          mechanical/generate_reference_diagrams_v06.py
          mechanical/render_flag_power_route_v06.py
          mechanical/render_catalog_part_callouts_v075.py
          mechanical/generate_detail_diagrams_v075.py
          mechanical/generate_hermeticity_diagram_v075.py
          mechanical/validate_models_v06.py
          mechanical/validate_catalog_model_semantics_v075.py
          electronics/generate_electronics_diagrams_v075.py

  mechanical:
    needs: quality
    if: needs.quality.outputs.mechanical == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - name: Download only mechanical LFS objects
        run: git lfs pull --include="*.glb,*.stl" --exclude=""

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mechanical/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install mechanical dependencies
        run: python -m pip install --requirement mechanical/requirements.txt

      - name: Run unified reproducible build
        run: npm run build:ci

  android:
    needs: quality
    if: needs.quality.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        working-directory: android/crucian-control
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: crucian-control-debug
          path: android/crucian-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  firmware:
    needs: quality
    if: needs.quality.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: electronics/firmware/esp32_c3_crucian_v06
            environment: esp32-c3-devkitm-1
            artifact: crucian-v06-firmware
          - project: electronics/firmware/esp32_c3_flag_light
            environment: esp32-c3-supermini-plus
            artifact: flag-light-legacy-firmware
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PlatformIO Core
        run: python -m pip install platformio==6.1.19

      - name: Build firmware
        run: pio run --project-dir "${{ matrix.project }}"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.project }}/.pio/build/${{ matrix.environment }}/firmware.bin
          if-no-files-found: error
