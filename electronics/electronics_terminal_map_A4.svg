<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<style>.title{font:700 7px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.sub{font:3.3px 'DejaVu Sans',Arial,sans-serif;fill:#52616a}.th{font:700 3.6px 'DejaVu Sans',Arial,sans-serif;fill:white}.td{font:3.1px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.note{font:3px 'DejaVu Sans',Arial,sans-serif;fill:#172126}</style>
<rect width="297" height="210" fill="#f5f6f7"/>
<text x="148.5" y="10" text-anchor="middle" class="title">Crucian v0.7.3 — карта клемм, GPIO и разъёмов</text>
<text x="148.5" y="16" text-anchor="middle" class="sub">карта функциональная: физические цвета M125, J1 и маркировки китайских модулей подтверждаются прозвонкой</text>
<rect x="10" y="24" width="277" height="9" rx="2" fill="#234f59"/>
<text x="14" y="30" class="th">Узел</text><text x="67" y="30" class="th">Контакт</text><text x="116" y="30" class="th">Назначение</text>

<rect x="10" y="33" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="33" x2="63" y2="40.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="33" x2="112" y2="40.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="37.9" class="td">Вход Crucian</text>
<text x="67" y="37.9" class="td">+12 В</text>
<text x="116" y="37.9" class="td">стабилизированные 12 В после внешней 6×18650-подсистемы</text>
<rect x="10" y="40.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="40.5" x2="63" y2="48.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="40.5" x2="112" y2="48.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="45.4" class="td">Вход Crucian</text>
<text x="67" y="45.4" class="td">GND</text>
<text x="116" y="45.4" class="td">общий минус; второй канал через M125</text>
<rect x="10" y="48.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="48.0" x2="63" y2="55.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="48.0" x2="112" y2="55.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="52.9" class="td">M125-0205</text>
<text x="67" y="52.9" class="td">канал A</text>
<text x="116" y="52.9" class="td">+12 В; цвет определить прозвонкой</text>
<rect x="10" y="55.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="55.5" x2="63" y2="63.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="55.5" x2="112" y2="63.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="60.4" class="td">M125-0205</text>
<text x="67" y="60.4" class="td">канал B</text>
<text x="116" y="60.4" class="td">GND; цвет определить прозвонкой</text>
<rect x="10" y="63.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="63.0" x2="63" y2="70.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="63.0" x2="112" y2="70.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="67.9" class="td">DC-DC</text>
<text x="67" y="67.9" class="td">VIN+ / VIN−</text>
<text x="116" y="67.9" class="td">+12 В STAR / GND STAR</text>
<rect x="10" y="70.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="70.5" x2="63" y2="78.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="70.5" x2="112" y2="78.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="75.4" class="td">DC-DC</text>
<text x="67" y="75.4" class="td">VOUT+ / VOUT−</text>
<text x="116" y="75.4" class="td">5 В / GND на ESP32-C3</text>
<rect x="10" y="78.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="78.0" x2="63" y2="85.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="78.0" x2="112" y2="85.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="82.9" class="td">ESP32-C3</text>
<text x="67" y="82.9" class="td">GPIO3</text>
<text x="116" y="82.9" class="td">PWM → 100 Ω → Gate LR7843</text>
<rect x="10" y="85.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="85.5" x2="63" y2="93.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="85.5" x2="112" y2="93.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="90.4" class="td">ESP32-C3</text>
<text x="67" y="90.4" class="td">GPIO4</text>
<text x="116" y="90.4" class="td">SDA общей I²C-шины</text>
<rect x="10" y="93.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="93.0" x2="63" y2="100.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="93.0" x2="112" y2="100.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="97.9" class="td">ESP32-C3</text>
<text x="67" y="97.9" class="td">GPIO5</text>
<text x="116" y="97.9" class="td">SCL общей I²C-шины</text>
<rect x="10" y="100.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="100.5" x2="63" y2="108.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="100.5" x2="112" y2="108.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="105.4" class="td">ESP32-C3</text>
<text x="67" y="105.4" class="td">3V3</text>
<text x="116" y="105.4" class="td">питание VEML7700 и AHT20+BMP280</text>
<rect x="10" y="108.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="108.0" x2="63" y2="115.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="108.0" x2="112" y2="115.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="112.9" class="td">VEML7700</text>
<text x="67" y="112.9" class="td">VIN/GND/SDA/SCL</text>
<text x="116" y="112.9" class="td">3,3 В / GND / GPIO4 / GPIO5</text>
<rect x="10" y="115.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="115.5" x2="63" y2="123.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="115.5" x2="112" y2="123.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="120.4" class="td">AHT20+BMP280</text>
<text x="67" y="120.4" class="td">VDD/GND/SDA/SCL</text>
<text x="116" y="120.4" class="td">3,3 В / GND / GPIO4 / GPIO5</text>
<rect x="10" y="123.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="123.0" x2="63" y2="130.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="123.0" x2="112" y2="130.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="127.9" class="td">LR7843</text>
<text x="67" y="127.9" class="td">Source</text>
<text x="116" y="127.9" class="td">GND STAR</text>
<rect x="10" y="130.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="130.5" x2="63" y2="138.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="130.5" x2="112" y2="138.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="135.4" class="td">LR7843</text>
<text x="67" y="135.4" class="td">Drain</text>
<text x="116" y="135.4" class="td">J1 Pin − → минус неона</text>
<rect x="10" y="138.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="138.0" x2="63" y2="145.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="138.0" x2="112" y2="145.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="142.9" class="td">LR7843</text>
<text x="67" y="142.9" class="td">Gate</text>
<text x="116" y="142.9" class="td">GPIO3 через 100 Ω; 100 kΩ на GND</text>
<rect x="10" y="145.5" width="277" height="7.5" fill="#eaf0f2" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="145.5" x2="63" y2="153.0" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="145.5" x2="112" y2="153.0" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="150.4" class="td">J1 2-pin</text>
<text x="67" y="150.4" class="td">Pin +</text>
<text x="116" y="150.4" class="td">+12 В STAR → плюс неона</text>
<rect x="10" y="153.0" width="277" height="7.5" fill="#ffffff" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="63" y1="153.0" x2="63" y2="160.5" stroke="#ccd5d9" stroke-width=".3"/>
<line x1="112" y1="153.0" x2="112" y2="160.5" stroke="#ccd5d9" stroke-width=".3"/>
<text x="14" y="157.9" class="td">J1 2-pin</text>
<text x="67" y="157.9" class="td">Pin −</text>
<text x="116" y="157.9" class="td">Drain LR7843 → минус неона</text>
<rect x="10" y="165.5" width="277" height="31" rx="3" fill="#fff" stroke="#ccd5d9" stroke-width=".5"/>
<text x="15" y="172.5" class="note">Монтажная проверка: сначала прозвонить M125 и J1; затем проверить DC-DC без ESP; после этого подключать датчики и MOSFET.</text>
<text x="15" y="177.0" class="note">Герметичный J1 находится снаружи у флага. От него два провода идут по открытой обслуживаемой дорожке ниже спицы.</text>
<text x="15" y="181.5" class="note">Единственный ввод в сухой электронный бокс — TPU95-манжета #tpu95-3/#tpu95-4; внутри оставить сервисную петлю 30–40 мм.</text>
<text x="15" y="186.0" class="note">Значения 3,3 В, GPIO3/4/5 и адреса датчиков являются текущей схемой прошивки v0.7.3.</text>
<text x="15" y="190.5" class="note">Полярность конкретного MOSFET-модуля и возможность прямой пайки к Gate подтвердить по реальной плате.</text>
</svg>