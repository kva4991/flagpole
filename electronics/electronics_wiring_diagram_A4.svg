<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
<defs>
 <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#34535c"/></marker>
 <style>
 .title{font:700 7px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.sub{font:3.4px 'DejaVu Sans',Arial,sans-serif;fill:#52616a}
 .module{fill:#fff;stroke:#4a6972;stroke-width:.7}.power{fill:#fff1e4;stroke:#a95619;stroke-width:.8}.sensor{fill:#e9f5ef;stroke:#26714d;stroke-width:.7}.load{fill:#fff9d9;stroke:#94751a;stroke-width:.7}.boundary{fill:#eef1f3;stroke:#7b8b92;stroke-width:.7;stroke-dasharray:2 1}
 .bh{font:700 4px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.bt{font:3px 'DejaVu Sans',Arial,sans-serif;fill:#26343a}.lab{font:2.8px 'DejaVu Sans',Arial,sans-serif;fill:#1d4f5e}
 .wire{fill:none;stroke:#34535c;stroke-width:1.05}.wire12{fill:none;stroke:#d45d00;stroke-width:1.25}.gnd{fill:none;stroke:#20272c;stroke-width:1.15}.i2c{fill:none;stroke:#237d61;stroke-width:1.0}.pwm{fill:none;stroke:#8a2f6c;stroke-width:1.0}
 .note{font:3px 'DejaVu Sans',Arial,sans-serif;fill:#172126}.warn{font:700 3px 'DejaVu Sans',Arial,sans-serif;fill:#8b3f00}
 </style>
</defs>
<rect width="297" height="210" fill="#f5f6f7"/>
<text x="148.5" y="10" text-anchor="middle" class="title">Crucian v0.7.3 — актуальная схема соединений электроники</text>
<text x="148.5" y="16" text-anchor="middle" class="sub">внешний аккумуляторный блок заканчивается стабилизированным входом 12 В; измерения напряжения аккумулятора в проекте нет</text>

<rect x="8" y="28" width="42" height="28" rx="3" class="boundary"/>
<text x="29.0" y="36" text-anchor="middle" class="bh">Внешняя подсистема</text>
<text x="12" y="44" class="bt">6 × 18650</text>
<text x="12" y="49" class="bt">BMS / заряд / 12 В стабилизатор</text>
<text x="12" y="54" class="bt">вне границ Crucian</text>
<rect x="60" y="28" width="42" height="28" rx="3" class="power"/>
<text x="81.0" y="36" text-anchor="middle" class="bh">Ввод в шток</text>
<text x="64" y="44" class="bt">предохранитель по току ленты</text>
<text x="64" y="49" class="bt">2 жилы: +12 В / GND</text>
<text x="64" y="54" class="bt">проверить под нагрузкой</text>
<rect x="112" y="28" width="42" height="28" rx="3" class="module"/>
<text x="133.0" y="36" text-anchor="middle" class="bh">M125-0205</text>
<text x="116" y="44" class="bt">статор в штоке</text>
<text x="116" y="49" class="bt">ротор во вращающейся части</text>
<text x="116" y="54" class="bt">2 канала; ток проверить</text>
<rect x="164" y="25" width="48" height="34" rx="3" class="power"/>
<text x="188.0" y="33" text-anchor="middle" class="bh">12 В STAR</text>
<text x="168" y="41" class="bt">+12 В: неон, DC-DC, C1</text>
<text x="168" y="46" class="bt">GND: DC-DC, MOSFET Source</text>
<text x="168" y="51" class="bt">C1 1000–2200 µF / 25 В</text>
<rect x="224" y="28" width="60" height="28" rx="3" class="power"/>
<text x="254.0" y="36" text-anchor="middle" class="bh">DC-DC 12 → 5 В</text>
<text x="228" y="44" class="bt">5 В на ESP32-C3</text>
<text x="228" y="49" class="bt">GND общий с силовой частью</text>
<text x="228" y="54" class="bt">выход проверить до подключения</text>
<path d="M50 42 L60 42" class="wire12" marker-end="url(#arrow)"/>
<text x="55.0" y="40.0" text-anchor="middle" class="lab">стаб. 12 В</text>
<path d="M102 42 L112 42" class="wire12" marker-end="url(#arrow)"/>
<text x="107.0" y="40.0" text-anchor="middle" class="lab">2 жилы</text>
<path d="M154 42 L164 42" class="wire12" marker-end="url(#arrow)"/>
<text x="159.0" y="40.0" text-anchor="middle" class="lab">+12/GND</text>
<path d="M212 42 L224 42" class="wire12" marker-end="url(#arrow)"/>
<text x="218.0" y="40.0" text-anchor="middle" class="lab">12 В</text>
<rect x="105" y="78" width="58" height="42" rx="3" class="module"/>
<text x="134.0" y="86" text-anchor="middle" class="bh">ESP32-C3 Mini Plus</text>
<text x="109" y="94" class="bt">5V / GND от DC-DC</text>
<text x="109" y="99" class="bt">GPIO3 = PWM</text>
<text x="109" y="104" class="bt">GPIO4 = SDA</text>
<text x="109" y="109" class="bt">GPIO5 = SCL</text>
<text x="109" y="114" class="bt">BLE имя из project_identity.json</text>
<path d="M254 56 L163 78" class="wire" marker-end="url(#arrow)"/>
<text x="208.5" y="65.0" text-anchor="middle" class="lab">5 В + GND</text>
<rect x="15" y="84" width="62" height="34" rx="3" class="sensor"/>
<text x="46.0" y="92" text-anchor="middle" class="bh">VEML7700</text>
<text x="19" y="100" class="bt">3,3 В / GND</text>
<text x="19" y="105" class="bt">SDA GPIO4 / SCL GPIO5</text>
<text x="19" y="110" class="bt">освещённость + fail-safe</text>
<text x="19" y="115" class="bt">калибровка через BLE</text>
<rect x="15" y="132" width="62" height="34" rx="3" class="sensor"/>
<text x="46.0" y="140" text-anchor="middle" class="bh">AHT20 + BMP280</text>
<text x="19" y="148" class="bt">3,3 В / GND</text>
<text x="19" y="153" class="bt">общая I²C-шина</text>
<text x="19" y="158" class="bt">AHT20: 0x38</text>
<text x="19" y="163" class="bt">BMP280: 0x76 / 0x77</text>
<path d="M105 95 L77 99" class="i2c" marker-end="url(#arrow)"/>
<text x="91.0" y="95.0" text-anchor="middle" class="lab">3,3 В + I²C</text>
<path d="M105 109 L77 149" class="i2c" marker-end="url(#arrow)"/>
<text x="91.0" y="127.0" text-anchor="middle" class="lab">3,3 В + I²C</text>
<rect x="176" y="82" width="48" height="38" rx="3" class="module"/>
<text x="200.0" y="90" text-anchor="middle" class="bh">LR7843 MOSFET</text>
<text x="180" y="98" class="bt">низкобоковый ключ</text>
<text x="180" y="103" class="bt">Gate: GPIO3 через 100 Ω</text>
<text x="180" y="108" class="bt">Gate → GND: 100 kΩ</text>
<text x="180" y="113" class="bt">Source → GND STAR</text>
<path d="M163 94 L176 94" class="pwm" marker-end="url(#arrow)"/>
<text x="169.5" y="92.0" text-anchor="middle" class="lab">PWM GPIO3</text>
<rect x="236" y="84" width="48" height="34" rx="3" class="module"/>
<text x="260.0" y="92" text-anchor="middle" class="bh">Герморазъём J1</text>
<text x="240" y="100" class="bt">2 pin, внешний</text>
<text x="240" y="105" class="bt">Pin +: +12 В STAR</text>
<text x="240" y="110" class="bt">Pin −: Drain MOSFET</text>
<text x="240" y="115" class="bt">под спицей у флага</text>
<path d="M212 59 L260 84" class="wire12" marker-end="url(#arrow)"/>
<text x="236.0" y="69.5" text-anchor="middle" class="lab">+12 В напрямую</text>
<path d="M224 101 L236 101" class="gnd" marker-end="url(#arrow)"/>
<text x="230.0" y="99.0" text-anchor="middle" class="lab">LOAD−</text>
<rect x="224" y="137" width="60" height="30" rx="3" class="load"/>
<text x="254.0" y="145" text-anchor="middle" class="bh">XUNATA 12 В Ø16</text>
<text x="228" y="153" class="bt">одноцветный круглый неон</text>
<text x="228" y="158" class="bt">по контуру ихтиса</text>
<text x="228" y="163" class="bt">ток и нагрев измерить</text>
<path d="M260 118 L254 137" class="wire12" marker-end="url(#arrow)"/>
<text x="257.0" y="125.5" text-anchor="middle" class="lab">2 провода</text>
<rect x="8" y="177" width="276" height="22" rx="3" fill="#fff" stroke="#c6d0d4" stroke-width=".5"/>
<text x="13" y="183.0" class="note">1. Никакого BAT/ADC: приложение и прошивка не показывают фиктивное напряжение аккумулятора.</text>
<text x="13" y="187.3" class="note">2. Цвета проводов M125 и разъёма фиксируются только после прозвонки реальных деталей.</text>
<text x="13" y="191.6" class="note">3. +12 В неона не коммутируется; MOSFET коммутирует только минус. Иначе PWM работать не будет.</text>
<text x="13" y="195.9" class="note">4. I²C-модули питаются от 3,3 В. Проверить, к какому напряжению подключены их встроенные подтяжки.</text>
</svg>