<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210">
  <defs>
    <style>
      .title{font:700 7px 'DejaVu Sans',Arial,sans-serif;fill:#111}
      .h{font:700 4.2px 'DejaVu Sans',Arial,sans-serif;fill:#111}
      .t{font:3.5px 'DejaVu Sans',Arial,sans-serif;fill:#111}
      .small{font:3px 'DejaVu Sans',Arial,sans-serif;fill:#222}
      .box{fill:#f8fafc;stroke:#334155;stroke-width:.7;rx:2;ry:2}
      .module{fill:#fff7ed;stroke:#9a3412;stroke-width:.7;rx:2;ry:2}
      .sensor{fill:#f0fdf4;stroke:#166534;stroke-width:.7;rx:2;ry:2}
      .conn{fill:#eff6ff;stroke:#1d4ed8;stroke-width:.7;rx:2;ry:2}
      .wire12{fill:none;stroke:#dc2626;stroke-width:1.2}
      .wireg{fill:none;stroke:#111827;stroke-width:1.2}
      .wire5{fill:none;stroke:#2563eb;stroke-width:1.0}
      .wire33{fill:none;stroke:#7c3aed;stroke-width:1.0}
      .sda{fill:none;stroke:#059669;stroke-width:.8}
      .scl{fill:none;stroke:#d97706;stroke-width:.8}
      .ctrl{fill:none;stroke:#0891b2;stroke-width:.9;stroke-dasharray:2 1}
      .swg{fill:none;stroke:#475569;stroke-width:1.2;stroke-dasharray:2 1}
      .note{fill:#fffbeb;stroke:#a16207;stroke-width:.5;rx:1.5;ry:1.5}
      .node{fill:#111}
    </style>
  </defs>
  <rect x="0" y="0" width="297" height="210" fill="white"/>
  <rect x="3" y="3" width="291" height="204" fill="none" stroke="#94a3b8" stroke-width=".5"/>
  <text x="10" y="13" class="title">Схема подключения электроники светящегося флага</text>
  <text x="10" y="19" class="small">12 В по двум проводам через полое древко и токосъёмник; одноцветный круглый неон 12 В; ESP32-C3 + VEML7700</text>

  <!-- Fixed side -->
  <text x="12" y="30" class="h">НЕПОДВИЖНАЯ ЧАСТЬ / ОСНОВАНИЕ</text>
  <rect x="12" y="36" width="35" height="23" class="box"/>
  <text x="16" y="44" class="h">БП 12 В IP67</text>
  <text x="16" y="50" class="t">рекомендуется 12 В, 2 А</text>
  <text x="16" y="55" class="small">230 В остаётся внизу</text>

  <rect x="55" y="39" width="26" height="17" class="box"/>
  <text x="59" y="46" class="h">F1</text>
  <text x="59" y="51" class="t">T1.6A, 5×20</text>
  <text x="55" y="61" class="small">уточнить после измерения тока</text>

  <path d="M47 43 H55" class="wire12"/><path d="M47 54 H55" class="wireg"/>
  <path d="M81 43 H101" class="wire12"/><path d="M81 54 H101" class="wireg"/>
  <text x="85" y="39" class="small">кабель внутри древка</text>

  <!-- Slip ring -->
  <rect x="101" y="34" width="39" height="29" class="conn"/>
  <text x="105" y="42" class="h">Токосъёмник</text>
  <text x="105" y="48" class="t">M125-0205, 2×5 А</text>
  <text x="105" y="54" class="small">предпочтительный вариант</text>
  <text x="105" y="59" class="small">механически не нагружать</text>
  <path d="M140 43 H156" class="wire12"/><path d="M140 54 H156" class="wireg"/>

  <!-- Rotating side power node -->
  <text x="154" y="30" class="h">ВРАЩАЮЩАЯСЯ ЧАСТЬ НАВЕРШИЯ</text>
  <circle cx="158" cy="43" r="1.5" class="node"/><circle cx="158" cy="54" r="1.5" class="node"/>
  <text x="160" y="40" class="small">+12 V STAR</text>
  <text x="160" y="60" class="small">GND STAR</text>

  <!-- Bulk cap -->
  <rect x="151" y="67" width="34" height="17" class="box"/>
  <text x="155" y="74" class="h">C1</text>
  <text x="155" y="79" class="t">1000–2200 мкФ / 25 В</text>
  <path d="M158 43 V67" class="wire12"/><path d="M176 54 V67" class="wireg"/>

  <!-- Buck -->
  <rect x="195" y="36" width="43" height="25" class="module"/>
  <text x="199" y="44" class="h">DC-DC 12 → 5 В</text>
  <text x="199" y="50" class="t">фиксированный выход 5 В</text>
  <text x="199" y="56" class="small">OCP / КЗ / перегрев</text>
  <path d="M158 43 H195" class="wire12"/><path d="M158 54 H195" class="wireg"/>

  <!-- ESP -->
  <rect x="248" y="33" width="37" height="35" class="module"/>
  <text x="252" y="41" class="h">ESP32-C3</text>
  <text x="252" y="47" class="t">SuperMini Plus</text>
  <text x="252" y="53" class="small">5V ← DC-DC</text>
  <text x="252" y="58" class="small">GPIO3 → ключ</text>
  <text x="252" y="63" class="small">GPIO4/5 → I²C</text>
  <path d="M238 43 H248" class="wire5"/><path d="M238 54 H248" class="wireg"/>

  <!-- 5V cap -->
  <rect x="243" y="73" width="42" height="15" class="box"/>
  <text x="247" y="80" class="h">C2: 470 мкФ / 16 В</text>
  <text x="247" y="85" class="small">рядом с входом 5V ESP</text>
  <path d="M250 68 V73" class="wire5"/><path d="M280 68 V73" class="wireg"/>

  <!-- Sensor -->
  <rect x="239" y="99" width="46" height="27" class="sensor"/>
  <text x="243" y="107" class="h">VEML7700</text>
  <text x="243" y="113" class="t">VCC → 3V3 ESP</text>
  <text x="243" y="118" class="t">SDA → GPIO4</text>
  <text x="243" y="123" class="t">SCL → GPIO5</text>
  <path d="M258 68 V96 H250 V99" class="wire33"/>
  <path d="M268 68 V92 H260 V99" class="sda"/>
  <path d="M276 68 V95 H272 V99" class="scl"/>
  <path d="M282 68 V99" class="wireg"/>
  <text x="239" y="132" class="small">датчик сверху; зенитный световой тоннель</text>

  <!-- MOSFET module -->
  <rect x="179" y="102" width="50" height="32" class="module"/>
  <text x="183" y="110" class="h">PC817 + LR7843</text>
  <text x="183" y="116" class="t">опто-MOSFET, low-side</text>
  <text x="183" y="122" class="small">CTRL: GPIO3 + GND ESP</text>
  <text x="183" y="128" class="small">силовой GND → GND STAR</text>
  <path d="M250 60 H235 V105 H229" class="ctrl"/>
  <path d="M158 54 V130 H179" class="wireg"/>

  <!-- M12 and flag -->
  <rect x="126" y="107" width="39" height="29" class="conn"/>
  <text x="130" y="115" class="h">M12 A-coded, 3 pin</text>
  <text x="130" y="121" class="t">Pin 1: +12 В</text>
  <text x="130" y="126" class="t">Pin 3: GND switched</text>
  <text x="130" y="131" class="small">Pin 4: резерв</text>
  <path d="M158 43 V101 H145 V107" class="wire12"/>
  <path d="M179 118 H165" class="swg"/>

  <rect x="63" y="105" width="50" height="31" class="box"/>
  <text x="67" y="113" class="h">Флаг</text>
  <text x="67" y="119" class="t">XUNATA Round Neon</text>
  <text x="67" y="125" class="t">12 В, Ø16 мм, 2 провода</text>
  <text x="67" y="131" class="small">глаз — сквозное отверстие, без LED</text>
  <path d="M126 116 H113" class="wire12"/><path d="M126 128 H113" class="swg"/>

  <!-- legend -->
  <rect x="12" y="151" width="273" height="46" class="note"/>
  <text x="17" y="159" class="h">Ключевые соединения</text>
  <text x="17" y="166" class="t">1. +12 В после токосъёмника идёт напрямую на плюс светящейся ленты и на вход DC-DC.</text>
  <text x="17" y="172" class="t">2. Минус светящейся ленты включается модулем PC817 + LR7843; ESP управляет модулем через GPIO3.</text>
  <text x="17" y="178" class="t">3. Все земли сходятся в одной точке GND STAR. Силовой ток ленты не должен идти через провод земли ESP.</text>
  <text x="17" y="184" class="t">4. Перед подключением ESP отдельно выставить и измерить 5,0 В на выходе DC-DC.</text>
  <text x="17" y="190" class="t">5. При программировании по USB выключать 12 В либо размыкать питание 5 В от DC-DC.</text>

  <!-- wire legend -->
  <path d="M203 158 h14" class="wire12"/><text x="219" y="159.5" class="small">+12 В</text>
  <path d="M203 165 h14" class="wireg"/><text x="219" y="166.5" class="small">GND</text>
  <path d="M203 172 h14" class="wire5"/><text x="219" y="173.5" class="small">+5 В</text>
  <path d="M203 179 h14" class="wire33"/><text x="219" y="180.5" class="small">+3,3 В</text>
  <path d="M247 158 h14" class="ctrl"/><text x="263" y="159.5" class="small">управление</text>
  <path d="M247 165 h14" class="swg"/><text x="263" y="166.5" class="small">коммутируемый GND</text>
</svg>
